<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Gensolve</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<script>try{if(localStorage.getItem('gs_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<style>
  :root{--bg:#060607;--ink:#f4f4f5;--soft:#a1a1aa;--line:rgba(255,255,255,.17);--btn:#f4f4f5;--btn-ink:#0a0a0b;color-scheme:dark}
  html[data-theme="light"]{--bg:#fafafa;--ink:#0a0a0b;--soft:#3f3f46;--line:rgba(0,0,0,.16);--btn:#0a0a0b;--btn-ink:#fafafa;color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .code{font-size:clamp(72px,16vw,140px);font-weight:800;letter-spacing:-.05em;line-height:1;
    background:linear-gradient(110deg,#8b6cff,#22d3ee 55%,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:24px;margin:12px 0 8px}
  p{color:var(--soft);margin:0 0 28px}
  a{display:inline-block;padding:13px 22px;border-radius:14px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:600}
  a:focus-visible{outline:2px solid #22d3ee;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>It may have moved, or the link may be wrong.</p>
    <a href="/">Back to Gensolve</a>
  </main>
</body>
</html>
