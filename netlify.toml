# Netlify settings for the Gensolve site (static: no build step).
[build]
  publish = "."

# Basic security headers on every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fonts never change, so browsers can keep them for a year.
# Everything else uses Netlify's default (always checks for a newer version), so edits show up straight away.
[[headers]]
  for = "/static/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
